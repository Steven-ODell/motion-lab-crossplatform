[project]
name = "motion-lab"
version = "0.1.0"
description = "Animation editor for GSAP-style explainer videos, with MP4/GIF/WebM export"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "playwright>=1.47",
  "kokoro-onnx==0.6.1",
  "soundfile",
  "numpy",
]

[project.scripts]
motion = "motionlab.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["motionlab"]
